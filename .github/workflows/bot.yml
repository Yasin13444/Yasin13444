name: ABD Borsa Pro V9.3

on:
  workflow_dispatch:

  schedule:
    - cron: '*/5 8-23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: abd-borsa-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # KODU İNDİR
      # =====================================================

      - name: Kodu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =====================================================
      # PAKETLER
      # =====================================================

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      # =====================================================
      # DOSYALARI KONTROL ET
      # =====================================================

      - name: Dosyaları kontrol et
        run: |
          echo "======================================"
          echo "V9.3 DOSYA KONTROLÜ"
          echo "======================================"
          pwd
          ls -la
          echo ""
          echo "Bot dosyası:"
          ls -lh bot.py
          echo ""
          echo "Workflow:"
          ls -lh .github/workflows/bot.yml

      # =====================================================
      # BOTU ÇALIŞTIR
      # =====================================================

      - name: V9.3 botunu çalıştır
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "======================================"
          echo "ABD BORSA PRO V9.3"
          echo "======================================"
          python3 -u bot.py

      # =====================================================
      # SİNYAL GEÇMİŞİNİ KAYDET
      # =====================================================

      - name: Sinyal geçmişini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "signals.json kontrol ediliyor..."

          git add signals.json

          if git diff --cached --quiet; then
            echo "signals.json değişmedi."
            exit 0
          fi

          git commit -m "V9.3 sinyal geçmişini güncelle"

          echo "GitHub'daki son değişiklikler alınıyor..."

          git fetch origin main

          echo "Değişiklikler birleştiriliyor..."

          git rebase origin/main

          echo "GitHub'a gönderiliyor..."

          git push origin HEAD:main

          echo "Sinyal geçmişi başarıyla kaydedildi."

